        <path d="M12 13l3 3-3 3M16.5 19h4" fill="none" stroke="#aeb4b7" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>

        <text x="400" y="21" text-anchor="middle" fill="#c8cbcc">~ : bash — Konsole</text>

        <!-- Window controls -->
